<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Instalação do Anti-AI Craft</title>
  <desc id="desc">Fluxo em três etapas para adicionar o marketplace, instalar o plugin e confirmar a versão 0.4.0.</desc>
  <rect width="1600" height="900" fill="#0B0D10"/>
  <circle cx="1420" cy="90" r="280" fill="#F4A261" opacity="0.08"/>
  <circle cx="1520" cy="760" r="360" fill="#35C9A5" opacity="0.06"/>
  <text x="110" y="90" fill="#F4A261" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="3">ANTI-AI CRAFT · DOCUMENTAÇÃO</text>
  <text x="110" y="175" fill="#F4F7FA" font-family="Segoe UI, sans-serif" font-size="62" font-weight="750">Instalação em três passos</text>
  <text x="110" y="225" fill="#98A2B3" font-family="Segoe UI, sans-serif" font-size="25">Marketplace público, instalação verificável e carregamento em uma nova tarefa.</text>

  <rect x="110" y="300" width="1380" height="420" rx="28" fill="#141820" stroke="#2A3140" stroke-width="2"/>
  <rect x="110" y="300" width="1380" height="62" rx="28" fill="#1B2130"/>
  <circle cx="150" cy="331" r="8" fill="#F26D6D"/><circle cx="178" cy="331" r="8" fill="#E9C46A"/><circle cx="206" cy="331" r="8" fill="#35C9A5"/>
  <text x="250" y="340" fill="#98A2B3" font-family="Cascadia Code, Consolas, monospace" font-size="18">Fluxo de instalação</text>

  <circle cx="175" cy="423" r="28" fill="#F4A261"/><text x="175" y="432" text-anchor="middle" fill="#0B0D10" font-family="Segoe UI, sans-serif" font-size="23" font-weight="800">1</text>
  <text x="225" y="414" fill="#F4F7FA" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Adicionar o marketplace</text>
  <rect x="225" y="436" width="1170" height="58" rx="12" fill="#0E1117"/>
  <text x="250" y="473" fill="#D5DCE6" font-family="Cascadia Code, Consolas, monospace" font-size="20">codex plugin marketplace add Zythenth/anti-ai-craft --ref main</text>

  <circle cx="175" cy="541" r="28" fill="#8B7CF6"/><text x="175" y="550" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="23" font-weight="800">2</text>
  <text x="225" y="532" fill="#F4F7FA" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Instalar o plugin</text>
  <rect x="225" y="554" width="1170" height="58" rx="12" fill="#0E1117"/>
  <text x="250" y="591" fill="#D5DCE6" font-family="Cascadia Code, Consolas, monospace" font-size="20">codex plugin add anti-ai-craft@zythenth</text>

  <circle cx="175" cy="659" r="28" fill="#35C9A5"/><path d="M162 659l9 9 18-21" fill="none" stroke="#0B0D10" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="225" y="651" fill="#F4F7FA" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Abrir uma nova tarefa</text>
  <text x="225" y="686" fill="#98A2B3" font-family="Segoe UI, sans-serif" font-size="20">O Codex carrega as seis skills no início da nova tarefa.</text>

  <rect x="110" y="765" width="1380" height="70" rx="18" fill="#112A25" stroke="#236B5C"/>
  <text x="145" y="808" fill="#71E4C8" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">✓ Verificado: anti-ai-craft@zythenth · instalado e habilitado · versão 0.4.0</text>
</svg>
