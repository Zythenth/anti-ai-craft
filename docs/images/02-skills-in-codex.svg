<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mapa das seis skills do Anti-AI Craft</title>
  <desc id="desc">Catálogo documental com três skills automáticas ou manuais e três skills manuais.</desc>
  <rect width="1600" height="900" fill="#0B0D10"/>
